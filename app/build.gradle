plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.appsitef.smartpos'
    compileSdk 34

    signingConfigs {
        gertec {
            storeFile file("keystore/Development_GertecDeveloper_CustomerAPP.keystore")
            storePassword "Development@GertecDeveloper2018"
            keyAlias "developmentgertecdeveloper_customerapp"
            keyPassword "Development@GertecDeveloper2018"
        }
    }

    defaultConfig {
        applicationId "com.appsitef.smartpos"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.0.7"

        ndk {
            abiFilters "armeabi-v7a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "device"
    productFlavors {
        gpos720 {
            dimension "device"
            buildConfigField "String", "GERTEC_MODEL", "\"GPOS720\""
            buildConfigField "boolean", "GERTEC_USES_SETIS_PPCOMP", "true"
        }
        gpos700 {
            dimension "device"
            buildConfigField "String", "GERTEC_MODEL", "\"GPOS700\""
            buildConfigField "boolean", "GERTEC_USES_SETIS_PPCOMP", "false"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes.each {
        it.buildConfigField "String", "ABASTECIMENTO_BASE_URL", "\"https://seu-servidor-rest.com/api/\""
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gertec
        }
        release {
            signingConfig signingConfigs.gertec
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Manual v2.21 §4: não fazer strip em libclisitef.so (evita erro -158 de assinatura).
            keepDebugSymbols += "**/libclisitef.so"
        }
    }
}

tasks.register("renameDebugApks") {
    doLast {
        def outDir = file("${buildDir}/outputs/apk")
        ["gpos720", "gpos700"].each { flavor ->
            def flavorDir = new File(outDir, "${flavor}/debug")
            def from = new File(flavorDir, "app-${flavor}-debug.apk")
            def to = new File(flavorDir, "siscom-pos-${flavor}-debug.apk")
            if (!from.exists()) {
                logger.lifecycle("renameDebugApks: ${from} não encontrado (flavor não montado)")
                return
            }
            to.parentFile?.mkdirs()
            from.withInputStream { input ->
                to.withOutputStream { output -> input.transferTo(output) }
            }
            if (to.length() != from.length() || to.length() < 1_000_000L) {
                throw new GradleException(
                    "renameDebugApks: cópia inválida ${to.name} (${to.length()} bytes). Esperado ~${from.length()}."
                )
            }
            if (!from.delete()) {
                logger.warn("renameDebugApks: não removeu ${from.name}")
            }
            logger.lifecycle("renameDebugApks: ${to} (${to.length()} bytes)")
        }
    }
}

afterEvaluate {
    dependencies {
        add("gpos720DebugImplementation", fileTree(dir: "libs/gpos720-debug", include: ["*.jar"]))
        add("gpos720ReleaseImplementation", fileTree(dir: "libs/gpos720-release", include: ["*.jar"]))
    }
    tasks.matching {
        it.name == "assembleGpos720Debug" || it.name == "assembleGpos700Debug"
    }.configureEach {
        finalizedBy("renameDebugApks")
    }
    // Compat: assembleDebug gera os dois flavors e renomeia os APKs.
    tasks.matching { it.name == "assembleDebug" }.configureEach {
        finalizedBy("renameDebugApks")
    }
}

tasks.register("prepareTefAssets") {
    group = "build"
    description = "Copia clsit.ini e cheques.ini de app/tef-config para assets do APK"
    doLast {
        def tefConfigDir = file("tef-config")
        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()

        def clsit = new File(tefConfigDir, "clsit.ini")
        if (clsit.exists()) {
            copy {
                from clsit
                into assetsDir
                rename { "CLSIT" }
            }
        }

        def cheques = new File(tefConfigDir, "cheques.ini")
        if (cheques.exists()) {
            copy {
                from cheques
                into assetsDir
                rename { "cheques.ini" }
            }
            copy {
                from cheques
                into assetsDir
                rename { "Cheque.ini" }
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareTefAssets")
}

dependencies {
    // GPOS720 — PPComp Setis + GEDI 720 (os dois build types)
    gpos720Implementation fileTree(dir: 'libs/gpos720', include: ['*.jar'])

    // GPOS700 — CliSiTef homologação + ppcomp 1.29.6 (200422) + GEDI 1.14.15.
    // A nativa que o terminal identifica é 001.29 200422, a mesma do exemplo.
    gpos700Implementation fileTree(dir: 'libs/gpos700', include: ['*.jar'])

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.zxing:core:3.5.3'
}

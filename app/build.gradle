plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.appsitef.smartpos'
    compileSdk 34

    signingConfigs {
        gertec {
            storeFile file("keystore/Development_GertecDeveloper_CustomerAPP.keystore")
            storePassword "Development@GertecDeveloper2018"
            keyAlias "developmentgertecdeveloper_customerapp"
            keyPassword "Development@GertecDeveloper2018"
        }
    }

    defaultConfig {
        applicationId "com.appsitef.smartpos"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        ndk {
            abiFilters "armeabi-v7a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes.each {
        it.buildConfigField "String", "ABASTECIMENTO_BASE_URL", "\"https://seu-servidor-rest.com/api/\""
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gertec
        }
        release {
            signingConfig signingConfigs.gertec
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Manual v2.21 §4: não fazer strip em libclisitef.so (evita erro -158 de assinatura).
            keepDebugSymbols += "**/libclisitef.so"
        }
    }
}

tasks.register("renameDebugApk") {
    doLast {
        def outDir = file("${buildDir}/outputs/apk/debug")
        def from = new File(outDir, "app-debug.apk")
        def to = new File(outDir, "siscom-pos-debug.apk")
        if (!from.exists()) {
            logger.warn("renameDebugApk: ${from.name} não encontrado")
            return
        }
        // Windows: File.renameTo pode falhar/deixar APK truncado; copiar é mais seguro.
        to.parentFile?.mkdirs()
        from.withInputStream { input ->
            to.withOutputStream { output -> input.transferTo(output) }
        }
        if (to.length() != from.length() || to.length() < 1_000_000L) {
            throw new GradleException(
                "renameDebugApk: cópia inválida (${to.length()} bytes). Esperado ~${from.length()}."
            )
        }
        if (!from.delete()) {
            logger.warn("renameDebugApk: não removeu ${from.name}")
        }
        logger.lifecycle("renameDebugApk: ${to.name} (${to.length()} bytes)")
    }
}

afterEvaluate {
    tasks.matching { it.name == "assembleDebug" }.configureEach {
        finalizedBy("renameDebugApk")
    }
}

tasks.register("prepareTefAssets") {
    group = "build"
    description = "Copia clsit.ini e cheques.ini de app/tef-config para assets do APK"
    doLast {
        def tefConfigDir = file("tef-config")
        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()

        def clsit = new File(tefConfigDir, "clsit.ini")
        if (clsit.exists()) {
            copy {
                from clsit
                into assetsDir
                rename { "CLSIT" }
            }
        }

        def cheques = new File(tefConfigDir, "cheques.ini")
        if (cheques.exists()) {
            copy {
                from cheques
                into assetsDir
                rename { "cheques.ini" }
            }
            copy {
                from cheques
                into assetsDir
                rename { "Cheque.ini" }
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareTefAssets")
}

